name: Deploy Site

on:
  push:
    branches:
      - v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        run: npm ci

      - name: Build & Export
        run: |
          npm run build-resume
          cd personal-site
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: personal-site/out
